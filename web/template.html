<title>Med 4 Révisions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : barre d'onglets (comme dans l'Excel) → vue active. Tableau de bord, une vue par matière (colonnes de l'onglet), référentiel externat. Surligneur jaune = à revoir. */
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --ink: #1b2240;
  --muted: #5d6585;
  --line: #dfe3ee;
  --accent: #2c3e9e;
  --accent-soft: #e6e9f8;
  --hl: #ffe866;          /* surligneur */
  --hl-ink: #5a4a00;
  --ok: #1f8a5b; --ok-bg: #e2f4ea;
  --warn: #b5620a; --warn-bg: #fdf0df;
  --none: #9aa1b8;
  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11142a; --surface: #191d36; --ink: #e7e9f5; --muted: #a0a6c4; --line: #2b3055;
  --accent: #9aa8ff; --accent-soft: #252b55; --hl: #6b5d10; --hl-ink: #fff3b0;
  --ok: #5fd39c; --ok-bg: #173527; --warn: #f2a95a; --warn-bg: #3a2810; --none: #69708f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11142a; --surface: #191d36; --ink: #e7e9f5; --muted: #a0a6c4; --line: #2b3055;
  --accent: #9aa8ff; --accent-soft: #252b55; --hl: #6b5d10; --hl-ink: #fff3b0;
  --ok: #5fd39c; --ok-bg: #173527; --warn: #f2a95a; --warn-bg: #3a2810; --none: #69708f; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px }
.wrap > *, main { min-width: 0 }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.label { font: 600 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
button, select, input { font: inherit; color: inherit }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; padding-block: 24px 0 }
header.top h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 700; letter-spacing: -.01em }
header.top h1 mark { background: linear-gradient(transparent 55%, var(--hl) 55%); color: inherit; padding: 0 .1em }
header.top p { margin: 4px 0 0; color: var(--muted) }
.meta-src { font-size: 13px; color: var(--muted); text-align: right }

/* Onglets façon classeur */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin }
nav.tabs .row { display: flex; gap: 4px; width: max-content }
nav.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px 8px 0 0; padding: 7px 12px; cursor: pointer; white-space: nowrap; font-size: 14px; display: flex; gap: 6px; align-items: center }
nav.tabs button .mono { font-size: 11px; color: var(--muted) }
nav.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff }
nav.tabs button[aria-selected="true"] .mono { color: #dfe4ff }
nav.tabs .sep { width: 1px; background: var(--line); margin: 4px 6px }

/* Tableau de bord */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px }
.kpi b { font: 700 28px/1 var(--f-display) }
.kpi small { color: var(--muted) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0 }
.panel h2 { font-size: 19px }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px }
.mat-list { display: grid; gap: 2px }
.mat-row { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 92px; gap: 12px; align-items: center; padding: 6px 4px; border-radius: 6px; cursor: pointer; border: 0; background: none; text-align: left; width: 100% }
.mat-row:hover { background: var(--accent-soft) }
.mat-row .name { font-weight: 700; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bar { height: 12px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex }
.bar i { display: block; height: 100% }
.bar .b3 { background: var(--ok) } .bar .b2 { background: color-mix(in srgb, var(--ok) 65%, var(--surface)) } .bar .b1 { background: color-mix(in srgb, var(--ok) 35%, var(--surface)) }
.mat-row .pct { font-size: 13px; text-align: right; color: var(--muted) }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted) }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c) }
.todo { display: grid; gap: 6px; max-height: 520px; overflow: auto }
.todo div { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; font-size: 14px; padding: 6px 8px; border-radius: 6px; background: linear-gradient(90deg, var(--hl) 0 4px, transparent 4px) }
.todo div span:last-child { min-width: 0 }
.todo small { display: block; color: var(--muted); text-transform: capitalize }

/* Vue matière */
.mhead { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: end; justify-content: space-between }
.mhead h2 { font-size: 26px; text-transform: capitalize }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line) }
.source { font-size: 13px; color: var(--muted); max-width: 70ch }
.source a { color: var(--accent) }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.filters input[type="search"] { flex: 1 1 240px; min-width: 0 }
.filters select { max-width: 100%; text-overflow: ellipsis }
.filters input, .filters select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px }
.count { margin-left: auto; color: var(--muted); font-size: 14px }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
table { border-collapse: collapse; width: 100%; min-width: 760px }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font: 600 12px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface); position: sticky; top: 0; cursor: pointer; white-space: nowrap; user-select: none }
th[aria-sort="ascending"]::after { content: " ▲" } th[aria-sort="descending"]::after { content: " ▼" }
tbody tr:hover { background: var(--accent-soft) }
tr.todo-row td:first-child { box-shadow: inset 4px 0 0 var(--hl) }
td.item { font-family: var(--f-mono); white-space: nowrap; font-size: 13px }
td.nom { min-width: 260px }
.pill { display: inline-block; font: 600 12px/1 var(--f-mono); padding: 4px 8px; border-radius: 999px; white-space: nowrap }
.pill.oui { background: var(--ok-bg); color: var(--ok) } .pill.non { background: var(--line); color: var(--muted) } .pill.mixte { background: var(--warn-bg); color: var(--warn) }
.vu { display: inline-flex; gap: 3px; align-items: center }
.vu i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--none) }
.vu i.on { background: var(--ok); border-color: var(--ok) }
.vu .n { margin-left: 6px; font-family: var(--f-mono); font-size: 13px }
.local { color: var(--accent); font-size: 11px; font-family: var(--f-mono) }
.acts { display: flex; gap: 6px; white-space: nowrap }
.acts button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer }
.acts button:hover { border-color: var(--accent); color: var(--accent) }
.extra { font-size: 13px; color: var(--muted) }
.extra b { color: var(--ink); font-weight: 700 }
.empty { padding: 28px; text-align: center; color: var(--muted) }
.col-note { font-size: 13px; color: var(--muted) }
.colleges { font-size: 13px; color: var(--muted) }
.inmat { display: flex; flex-wrap: wrap; gap: 4px }
.inmat button { font-size: 12px; border: 1px solid var(--line); background: var(--accent-soft); border-radius: 4px; padding: 2px 6px; cursor: pointer; text-transform: capitalize }
footer { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center }
footer button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer }

@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 520px) { .mat-row { grid-template-columns: 100px minmax(0, 1fr) 64px } .meta-src { text-align: left } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <span class="label">Carnet de révisions · EDN</span>
      <h1>Med 4 <mark>Révisions</mark></h1>
      <p>Tes 16 matières et le référentiel de l'externat, organisés comme ton classeur.</p>
    </div>
    <div class="meta-src" id="metaSrc"></div>
  </header>

  <nav class="tabs" aria-label="Onglets du classeur"><div class="row" id="tabs" role="tablist"></div></nav>

  <main id="view"></main>

  <footer>
    <span>Les boutons « +1 vu » et « Révisé » enregistrent tes progrès dans ce navigateur, sans modifier le Google Sheet.</span>
    <button type="button" id="resetLocal">Effacer mes progrès locaux</button>
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let local = store.get('med4_local', {});   // { "matiere|index": { vu: +n, revision: "YYYY-MM-DD" } }
  const today = () => new Date().toISOString().slice(0, 10);
  const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';

  D.matieres.forEach(m => { m.slug = slug(m.onglet); m.items.forEach((it, i) => it.key = m.slug + '|' + i); });
  const MAT = Object.fromEntries(D.matieres.map(m => [m.slug, m]));

  function cur(it) {
    const l = local[it.key] || {};
    const vu = (typeof it.vu === 'number' ? it.vu : 0) + (l.vu || 0);
    const rev = [it.revision, l.revision].filter(Boolean).sort().pop() || null;
    return { vu, rev, changed: !!(l.vu || l.revision) };
  }
  const redClass = r => !r ? '' : /^oui$/i.test(r) ? 'oui' : /^non\s*$/i.test(r) ? 'non' : 'mixte';
  const isRed = r => r && /oui/i.test(r);

  const metaDate = new Date(D.extracted_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  $('metaSrc').innerHTML = esc(D.source) + '<br>Données du ' + esc(metaDate);

  // Onglets
  const TABS = [{ id: 'bord', label: 'Tableau de bord' }].concat(D.matieres.map(m => ({ id: m.slug, label: m.onglet, n: m.items.length })), [{ id: 'externat', label: 'externat', n: D.externat.length }]);
  function drawTabs(active) {
    $('tabs').innerHTML = TABS.map((t, i) => (i === TABS.length - 1 || i === 1 ? '<span class="sep"></span>' : '') +
      '<button type="button" role="tab" data-tab="' + t.id + '" aria-selected="' + (t.id === active) + '">' + esc(t.label) + (t.n ? ' <span class="mono">' + t.n + '</span>' : '') + '</button>').join('');
    $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
    const a = $('tabs').querySelector('[aria-selected="true"]'); if (a) a.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function go(id) { try { history.replaceState(null, '', '#' + id); } catch (e) {} route(id); window.scrollTo(0, 0); }
  function route(id) {
    if (!id || (!MAT[id] && id !== 'externat')) id = 'bord';
    drawTabs(id);
    if (id === 'bord') return dash();
    if (id === 'externat') return externat();
    matiere(MAT[id]);
  }

  // Tableau de bord
  function dash() {
    let tot = 0, seen = 0, red = 0, redSeen = 0, last = null;
    const rows = D.matieres.map(m => {
      const c = [0, 0, 0, 0]; let mr = 0, mrs = 0;
      m.items.forEach(it => { const s = cur(it); c[Math.min(s.vu, 3)]++; if (s.rev && (!last || s.rev > last)) last = s.rev; if (isRed(it.redacteur)) { mr++; if (s.vu) mrs++; } });
      const n = m.items.length; tot += n; seen += n - c[0]; red += mr; redSeen += mrs;
      return { m, n, c, pct: Math.round((n - c[0]) / n * 100) };
    });
    const todo = [];
    D.matieres.forEach(m => m.items.forEach(it => { if (isRed(it.redacteur) && cur(it).vu === 0) todo.push({ m, it }); }));
    $('view').innerHTML =
      '<section class="kpis">' +
        kpi('Lignes suivies', tot, D.matieres.length + ' matières') +
        kpi('Déjà vues au moins 1 fois', seen, Math.round(seen / tot * 100) + ' % du total') +
        kpi('Items où le collège est rédacteur', red, redSeen + ' déjà vus') +
        kpi('Dernière révision', last ? fmtDate(last) : '—', 'toutes matières') +
      '</section>' +
      '<div class="grid2">' +
        '<section class="panel"><h2>Avancement par matière</h2>' +
          '<div class="legend"><span style="--c:var(--ok)">vu 3 fois ou plus</span><span style="--c:color-mix(in srgb,var(--ok) 65%,var(--surface))">2 fois</span><span style="--c:color-mix(in srgb,var(--ok) 35%,var(--surface))">1 fois</span><span style="--c:var(--line)">jamais</span></div>' +
          '<div class="mat-list">' + rows.map(r => '<button type="button" class="mat-row" data-go="' + r.m.slug + '"><span class="name">' + esc(r.m.onglet) + '</span><span class="bar">' +
            [3, 2, 1].map(k => r.c[k] ? '<i class="b' + k + '" style="width:' + (r.c[k] / r.n * 100) + '%"></i>' : '').join('') +
            '</span><span class="pct mono">' + (r.n - r.c[0]) + '/' + r.n + '</span></button>').join('') + '</div></section>' +
        '<section class="panel"><h2>Priorités : rédacteur, jamais vus</h2><p class="col-note">Items dont le collège de la matière est rédacteur (colonne « Rédacteur ? » = Oui) et pas encore vus. ' + todo.length + ' au total.</p>' +
          '<div class="todo">' + todo.map(t => '<div><span class="mono">' + esc(t.it.label) + '</span><span>' + esc(t.it.nom) + '<small>' + esc(t.m.onglet) + '</small></span></div>').join('') + '</div></section>' +
      '</div>';
    $('view').querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  }
  const kpi = (l, v, s) => '<div class="kpi"><span class="label">' + l + '</span><b class="mono">' + esc(v) + '</b><small>' + esc(s) + '</small></div>';

  // Vue matière : colonnes de l'onglet
  const mstate = {};
  function matiere(m) {
    const st = mstate[m.slug] || (mstate[m.slug] = { q: '', red: '', vu: '', sort: null, dir: 1 });
    const nomCol = m.colonnes.find(c => /^(nom|cours)$/i.test(c)) || 'Nom';
    const itemCol = m.colonnes.find(c => /^item$/i.test(c)) || 'Item';
    const cols = [
      { k: 'item', t: itemCol }, { k: 'nom', t: nomCol }, { k: 'red', t: 'Rédacteur ?' },
      { k: 'vu', t: 'Nombre de fois vu' }, { k: 'rev', t: 'Dernière révision' }
    ].concat(m.colonnes_extra.map(x => ({ k: 'x:' + x, t: x }))).concat([{ k: 'act', t: '' }]);
    const src = m.source && m.source.edition ? '<p class="source">Source du sommaire : ' + esc(m.source.edition) +
      (m.source.url ? ' · <a href="' + esc(m.source.url) + '" target="_blank" rel="noopener">lien</a>' : '') + (m.source.note ? ' · ' + esc(m.source.note) : '') + '</p>' : '';
    const n = m.items.length, seen = m.items.filter(it => cur(it).vu > 0).length, red = m.items.filter(it => isRed(it.redacteur)).length;
    $('view').innerHTML =
      '<section class="mhead"><div><span class="label">Onglet</span><h2>' + esc(m.onglet) + '</h2>' + src + '</div>' +
      '<div class="chips"><span class="chip">' + n + ' items</span><span class="chip">' + red + ' rédacteur</span><span class="chip">' + seen + ' vus</span><span class="chip">' + (n - seen) + ' jamais vus</span></div></section>' +
      '<div class="filters" style="margin-top:14px"><input id="fq" type="search" placeholder="Rechercher un item ou un intitulé" aria-label="Rechercher" value="' + esc(st.q) + '">' +
      '<select id="fred" aria-label="Rédacteur"><option value="">Rédacteur : tous</option><option value="oui">Rédacteur : oui</option><option value="non">Rédacteur : non</option></select>' +
      '<select id="fvu" aria-label="Nombre de fois vu"><option value="">Vu : tous</option><option value="0">Jamais vu</option><option value="1">Vu 1 fois</option><option value="2">Vu 2 fois</option><option value="3">Vu 3 fois ou plus</option></select>' +
      '<span class="count" id="cnt"></span></div>' +
      '<div class="tablebox" style="margin-top:12px"><table><thead><tr>' + cols.map(c => '<th scope="col" data-k="' + c.k + '"' + (st.sort === c.k ? ' aria-sort="' + (st.dir > 0 ? 'ascending' : 'descending') + '"' : '') + '>' + esc(c.t) + '</th>').join('') + '</tr></thead><tbody id="tb"></tbody></table></div>';
    $('fred').value = st.red; $('fvu').value = st.vu;
    $('fq').oninput = e => { st.q = e.target.value; body(); };
    $('fred').onchange = e => { st.red = e.target.value; body(); };
    $('fvu').onchange = e => { st.vu = e.target.value; body(); };
    $('view').querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
      const k = th.dataset.k; if (k === 'act') return;
      if (st.sort === k) st.dir = -st.dir; else { st.sort = k; st.dir = 1; }
      matiere(m);
    });
    function sortVal(it, k) {
      const s = cur(it);
      if (k === 'item') return it.nums[0] || 9999;
      if (k === 'nom') return it.nom.toLowerCase();
      if (k === 'red') return redClass(it.redacteur);
      if (k === 'vu') return s.vu;
      if (k === 'rev') return s.rev || '';
      if (k.startsWith('x:')) return String(it.extra[k.slice(2)] || '');
      return 0;
    }
    function body() {
      const q = st.q.toLowerCase();
      let list = m.items.filter(it => {
        const s = cur(it);
        if (q && !(it.label + ' ' + it.nom + ' ' + Object.values(it.extra).join(' ')).toLowerCase().includes(q)) return false;
        if (st.red === 'oui' && !isRed(it.redacteur)) return false;
        if (st.red === 'non' && isRed(it.redacteur)) return false;
        if (st.vu !== '' && Math.min(s.vu, 3) !== +st.vu) return false;
        return true;
      });
      if (st.sort) list = list.slice().sort((a, b) => { const x = sortVal(a, st.sort), y = sortVal(b, st.sort); return (x > y ? 1 : x < y ? -1 : 0) * st.dir; });
      $('cnt').textContent = list.length + ' / ' + n + ' lignes';
      $('tb').innerHTML = list.length ? list.map(it => {
        const s = cur(it);
        const dots = [0, 1, 2].map(i => '<i class="' + (i < s.vu ? 'on' : '') + '"></i>').join('');
        return '<tr class="' + (isRed(it.redacteur) && !s.vu ? 'todo-row' : '') + '">' +
          '<td class="item">' + esc(it.label) + '</td><td class="nom">' + esc(it.nom) + '</td>' +
          '<td>' + (it.redacteur ? '<span class="pill ' + redClass(it.redacteur) + '">' + esc(it.redacteur) + '</span>' : '') + '</td>' +
          '<td><span class="vu">' + dots + '<span class="n">' + s.vu + '</span></span></td>' +
          '<td class="mono">' + (s.rev ? fmtDate(s.rev) : '<span style="color:var(--none)">—</span>') + (s.changed ? ' <span class="local">local</span>' : '') + '</td>' +
          m.colonnes_extra.map(x => '<td class="extra">' + esc(it.extra[x] == null ? '' : it.extra[x]) + '</td>').join('') +
          '<td><span class="acts"><button type="button" data-plus="' + it.key + '">+1 vu</button><button type="button" data-rev="' + it.key + '">Révisé</button>' +
          (s.changed ? '<button type="button" data-undo="' + it.key + '" title="Annuler mes changements locaux">↺</button>' : '') + '</span></td></tr>';
      }).join('') : '<tr><td colspan="' + cols.length + '" class="empty">Aucune ligne ne correspond à ces filtres.</td></tr>';
      $('tb').querySelectorAll('[data-plus]').forEach(b => b.onclick = () => { const l = local[b.dataset.plus] || (local[b.dataset.plus] = {}); l.vu = (l.vu || 0) + 1; l.revision = today(); save(); body(); });
      $('tb').querySelectorAll('[data-rev]').forEach(b => b.onclick = () => { const l = local[b.dataset.rev] || (local[b.dataset.rev] = {}); l.revision = today(); save(); body(); });
      $('tb').querySelectorAll('[data-undo]').forEach(b => b.onclick = () => { delete local[b.dataset.undo]; save(); body(); });
    }
    body();
  }
  function save() { store.set('med4_local', local); }

  // Référentiel externat
  const xs = { q: '', col: '', cov: '' };
  function externat() {
    const byNum = {};
    D.matieres.forEach(m => m.items.forEach(it => it.nums.forEach(n => (byNum[n] = byNum[n] || []).push({ m, it }))));
    const colleges = [...new Set(D.externat.flatMap(e => e.colleges))].sort((a, b) => a.localeCompare(b, 'fr'));
    $('view').innerHTML =
      '<section class="mhead"><div><span class="label">Onglet</span><h2>Externat</h2><p class="source">Les ' + D.externat.length + ' items du programme avec le collège rédacteur, et les matières de ton classeur qui les contiennent.</p></div></section>' +
      '<div class="filters" style="margin-top:14px"><input id="xq" type="search" placeholder="Rechercher un n° ou un titre" aria-label="Rechercher" value="' + esc(xs.q) + '">' +
      '<select id="xcol" aria-label="Collège rédacteur"><option value="">Collège : tous</option>' + colleges.map(c => '<option>' + esc(c) + '</option>').join('') + '</select>' +
      '<select id="xcov" aria-label="Couverture"><option value="">Toutes les lignes</option><option value="in">Présents dans une matière</option><option value="out">Absents de tes matières</option><option value="never">Présents, jamais vus</option></select>' +
      '<span class="count" id="xcnt"></span></div>' +
      '<div class="tablebox" style="margin-top:12px"><table><thead><tr><th scope="col">N° item</th><th scope="col">Titre</th><th scope="col">Collège rédacteur (écriture)</th><th scope="col">Dans tes matières</th><th scope="col">Vu</th></tr></thead><tbody id="xtb"></tbody></table></div>';
    $('xcol').value = xs.col; $('xcov').value = xs.cov;
    $('xq').oninput = e => { xs.q = e.target.value; xbody(); };
    $('xcol').onchange = e => { xs.col = e.target.value; xbody(); };
    $('xcov').onchange = e => { xs.cov = e.target.value; xbody(); };
    function xbody() {
      const q = xs.q.toLowerCase();
      const list = D.externat.filter(e => {
        const hits = byNum[e.num] || [];
        const maxVu = Math.max(0, ...hits.map(h => cur(h.it).vu));
        if (q && !(String(e.num) + ' ' + e.titre).toLowerCase().includes(q)) return false;
        if (xs.col && !e.colleges.includes(xs.col)) return false;
        if (xs.cov === 'in' && !hits.length) return false;
        if (xs.cov === 'out' && hits.length) return false;
        if (xs.cov === 'never' && (!hits.length || maxVu > 0)) return false;
        return true;
      });
      $('xcnt').textContent = list.length + ' / ' + D.externat.length + ' items';
      $('xtb').innerHTML = list.map(e => {
        const hits = byNum[e.num] || [];
        const mats = [...new Map(hits.map(h => [h.m.slug, h.m])).values()];
        const maxVu = Math.max(0, ...hits.map(h => cur(h.it).vu));
        return '<tr><td class="item">' + e.num + '</td><td class="nom">' + esc(e.titre) + '</td><td class="colleges">' + e.colleges.map(esc).join('<br>') + '</td>' +
          '<td><span class="inmat">' + mats.map(m => '<button type="button" data-go="' + m.slug + '">' + esc(m.onglet) + '</button>').join('') + '</span></td>' +
          '<td class="mono">' + (hits.length ? maxVu : '<span style="color:var(--none)">—</span>') + '</td></tr>';
      }).join('') || '<tr><td colspan="5" class="empty">Aucun item ne correspond.</td></tr>';
      $('xtb').querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
    }
    xbody();
  }

  $('resetLocal').onclick = function () {
    if (this.dataset.armed) { local = {}; save(); this.textContent = 'Progrès locaux effacés'; delete this.dataset.armed; route((location.hash || '').slice(1)); }
    else { this.dataset.armed = '1'; this.textContent = 'Confirmer l\'effacement'; }
  };
  window.addEventListener('hashchange', () => route(location.hash.slice(1)));
  route((location.hash || '').slice(1));
})();
</script>
